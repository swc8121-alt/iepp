name: A3 VM Fork Harness

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  a3-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run A3 harness tests
        working-directory: reference/iepp_vnext
        run: python -m unittest discover -s tests -p 'test_a3_vm_runner.py' -v
