name: TRP 2.0 Attack Profiles

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate attack profiles
        working-directory: reference/iepp_vnext
        run: python -m unittest -v test_trp2_profiles.py
