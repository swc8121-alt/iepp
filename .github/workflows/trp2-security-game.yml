name: TRP 2.0 Security Game

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  bounded-security-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IEPP core dependencies
        run: python -m pip install -r requirements.txt
      - name: Run TRP 2.0 bounded security game
        working-directory: reference/iepp_vnext
        run: python run_trp2_ci.py
      - name: Run TRP 2.0 real-core merge gate
        working-directory: reference/iepp_vnext
        run: python -m unittest -v test_trp2_integration.py
